server {
    listen 80;
    server_name dspin.ma;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/dspin.ma;
        default_type text/plain;
    }

    location / {
        return 301 https://dspin.ma$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dspin.ma;
    root /var/www/html/dspin.ma;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/dspin.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dspin.ma/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location ~ /\. {
        deny all;
    }

    location ~* \.woff2$ {
        default_type font/woff2;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;
}
